<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1046, height=986" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1046px;
        height: 986px;
        overflow: hidden;
        background: #080a0f;
      }

      #root {
        position: relative;
        width: 1046px;
        height: 986px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(56, 98, 118, 0.92) 0%, rgba(208, 168, 103, 0.9) 78%),
          #080a0f;
      }

      .expanded-shot,
      .menubar-shot {
        position: absolute;
        user-select: none;
        -webkit-user-drag: none;
      }

      .expanded-shot {
        inset: 0;
        width: 1046px;
        height: 986px;
        object-fit: cover;
        filter: drop-shadow(0 22px 42px rgba(0, 0, 0, 0.24));
      }

      .menubar-wrap {
        position: absolute;
        top: 0;
        right: 0;
        width: 612px;
        height: 226px;
        overflow: hidden;
      }

      .menubar-shot {
        inset: 0;
        width: 612px;
        height: 226px;
        object-fit: cover;
      }

      .click-ring {
        position: absolute;
        top: 108px;
        right: 78px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 5px solid rgba(255, 255, 255, 0.78);
        box-shadow: 0 0 28px rgba(255, 255, 255, 0.3);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1046"
      data-height="986"
    >
      <img class="expanded-shot" src="assets/agent-beacon-hover-real.png" alt="" />
      <div class="menubar-wrap">
        <img class="menubar-shot" src="assets/agent-beacon-menubar-real.png" alt="" />
      </div>
      <div class="click-ring"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set(".expanded-shot", { opacity: 0, scale: 0.985, transformOrigin: "top right" }, 0);
      tl.from(".menubar-wrap", { opacity: 0, y: -12, duration: 0.45, ease: "power2.out" }, 0);
      tl.to(".click-ring", { opacity: 1, scale: 0.7, duration: 0.18, ease: "power2.out" }, 1.2);
      tl.to(".click-ring", { opacity: 0, scale: 1.5, duration: 0.55, ease: "power2.out" }, 1.38);
      tl.to(".expanded-shot", { opacity: 1, scale: 1, duration: 0.72, ease: "power2.out" }, 1.72);
      tl.to(".menubar-wrap", { opacity: 0, y: -18, duration: 0.38, ease: "power2.in" }, 1.78);
      tl.to(".expanded-shot", { scale: 1.012, duration: 1.1, yoyo: true, repeat: 2, ease: "sine.inOut" }, 3.05);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
