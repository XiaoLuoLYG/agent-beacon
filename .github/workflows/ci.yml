name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release package
        run: make package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBeacon-macOS
          path: dist/AgentBeacon-macOS.dmg
