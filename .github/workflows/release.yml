name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to update
        required: true
        default: v0.1.0
      upload:
        description: Upload DMG and ZIP to the GitHub Release
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  signed-release:
    name: Developer ID signed and notarized release
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64:?Missing DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 secret}"
          : "${DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD:?Missing DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD secret}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/agentbeacon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Run tests
        run: swift test

      - name: Build signed and notarized package
        env:
          AGENTBEACON_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          AGENTBEACON_NOTARIZE: "1"
          AGENTBEACON_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          AGENTBEACON_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGENTBEACON_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: make package

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail

          codesign --verify --deep --strict --verbose=4 "dist/Agent Beacon.app"
          xcrun stapler validate "dist/Agent Beacon.app"
          xcrun stapler validate "dist/AgentBeacon-macOS.dmg"
          hdiutil verify "dist/AgentBeacon-macOS.dmg"
          spctl -a -vv --type execute "dist/Agent Beacon.app"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBeacon-signed-release
          path: |
            dist/AgentBeacon-macOS.dmg
            dist/AgentBeacon-macOS.zip

      - name: Upload to GitHub Release
        if: ${{ inputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/AgentBeacon-macOS.dmg \
            dist/AgentBeacon-macOS.zip \
            --clobber
